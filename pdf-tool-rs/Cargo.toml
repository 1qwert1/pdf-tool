[package]
name = "pdf-tool"
version = "1.0.0"
description = "Сборка и редактирование PDF: изображения, качество, страницы"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "system_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
lopdf = "0.46.0"
pdfium-render = "0.9.4"
rfd = "0.17.2"
tempfile = "3.27.0"
which = "8.0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
